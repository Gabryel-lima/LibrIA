# Dependabot: abre PRs de atualização para dependências Python (requirements*.txt)
# e para as actions usadas nos workflows (.github/workflows/*.yml).
# Documentação: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # tensorflow==2.16.1 exige numpy<2 (o bump para 2.5.4 deixou o requirements
      # insolúvel). Liberar quando o TensorFlow for migrado.
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
