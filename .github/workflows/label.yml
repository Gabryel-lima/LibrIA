name: Label PRs

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
    - name: Auto-label based on size
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number
          });
          
          const additions = files.reduce((sum, f) => sum + f.additions, 0);
          let label = '';
          
          if (additions < 100) label = 'size/small';
          else if (additions < 500) label = 'size/medium';
          else if (additions < 1000) label = 'size/large';
          else label = 'size/xlarge';
          
          if (label) {
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [label]
            });
          }
    
    - name: Label based on branch
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          const branch = pr.head.ref;
          let labels = [];
          
          if (branch.startsWith('feat/')) labels.push('type/feature');
          else if (branch.startsWith('fix/')) labels.push('type/bug');
          else if (branch.startsWith('docs/')) labels.push('type/docs');
          else if (branch.startsWith('test/')) labels.push('type/test');
          
          if (labels.length) {
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: labels
            });
          }
