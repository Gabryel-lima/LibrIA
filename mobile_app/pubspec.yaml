name: libr_ia
description: LibrIA - Aplicativo de reconhecimento de Libras usando visão computacional
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI e Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  
  # Câmera e Processamento de Imagem
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # HTTP e API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Estado e Gerenciamento
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  
  # Armazenamento Local
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  
  # Permissões
  permission_handler: ^11.0.1
  
  # Utilitários
  intl: ^0.18.1
  uuid: ^4.2.1
  logger: ^2.0.2+1
  
  # Animações
  flutter_animate: ^4.2.0+1
  
  # Navegação
  go_router: ^12.1.3
  
  # Notificações
  # flutter_local_notifications: ^16.3.0
  
  # Analytics (opcional)
  firebase_analytics: ^10.7.4
  firebase_core: ^2.24.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  json_annotation: ^4.8.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/data/
  
  # fonts:
